# L1DeepMETv2 training config
# config1: default GNN setup (matches the original hardcoded values)

# inputs
N_FEATURES_CONT: 6
N_FEATURES_CAT: 2
SCALE_MOMENTUM: 128       # scaling factor of pT, px, py (hence the target MET)

# model
HIDDEN_DIM: 32
CONV_DEPTH: 4
ACTIVATION_FUNCTION: relu # 'relu' or 'sigmoid' (applied to the per-particle weights)
USE_EDGE_FEATURES: false  # if true: ParticleNeXt-style [ln(dR), ln(kT), ln(z)] edge features
USE_ATTENTIVE_POOLING: false # if true: softmax-weighted edge aggregation (vs hard max)

# graph
DELTA_R: 0.4

# loss
LOSS_TYPE: response_tune  # 'mse' or 'response_tune'
LOSS_C: 5000              # response-correction coefficient
LOSS_PT_THRESHOLD: 50     # GeV, before dividing by SCALE_MOMENTUM

# optimization
N_EPOCHS: 100
BATCH_SIZE: 128
LEARNING_RATE: 0.0001     # AdamW lr / CyclicLR base_lr
MAX_LR: 0.001             # CyclicLR max_lr
WEIGHT_DECAY: 0.001
VALIDATION_SPLIT: 0.2

CUSTOM_NOTE: "default config, matches original hardcoded values"
